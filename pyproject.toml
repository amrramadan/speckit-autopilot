[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "speckit-autopilot"
version = "0.1.0"
description = "Unattended Spec Kit pipeline for Claude Code: one issue -> spec -> plan -> tasks -> implement -> review -> merged PR."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "speckit-autopilot contributors" }]
keywords = ["claude-code", "spec-kit", "agent", "autopilot", "linear"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Software Development",
]
dependencies = ["claude-agent-sdk>=0.2.170,<0.3"]

[project.urls]
Homepage = "https://github.com/amrramadan/speckit-autopilot"
Issues = "https://github.com/amrramadan/speckit-autopilot/issues"
Changelog = "https://github.com/amrramadan/speckit-autopilot/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24"]

[project.scripts]
speckit-autopilot = "speckit_autopilot.__main__:entry"

[tool.hatch.build.targets.wheel]
packages = ["src/speckit_autopilot"]

[tool.hatch.build.targets.wheel.force-include]
"src/speckit_autopilot/statusline.sh" = "speckit_autopilot/statusline.sh"
"src/speckit_autopilot/repo_skills" = "speckit_autopilot/repo_skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: makes real Claude API calls (opt-in: AUTOPILOT_LIVE=1)"]
